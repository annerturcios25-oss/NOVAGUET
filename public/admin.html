<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVAGUET | Administración</title>

  <style>

    /* =========================

       DISEÑO GENERAL

    ========================= */

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    :root {

      --celeste: #00BFFF;

      --celeste-dark: #009acd;

      --dorado: #D4AF37;

      --negro: #050505;

      --negro-2: #090909;

      --gris-oscuro: #111111;

      --gris-card: #161616;

      --gris-input: #0d0d0d;

      --texto: #f5f5f5;

      --texto-secundario: #a7a7a7;

      --borde: rgba(0, 191, 255, 0.18);

    }

    html {

      width: 100%;

      min-height: 100%;

    }

    body {

      font-family: Arial, Helvetica, sans-serif;

      background:

        radial-gradient(

          circle at top left,

          rgba(0, 191, 255, 0.10),

          transparent 32%

        ),

        radial-gradient(

          circle at top right,

          rgba(212, 175, 55, 0.08),

          transparent 28%

        ),

        #050505;

      color: var(--texto);

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      overflow-x: hidden;

    }

    /* =========================

       DECORACIÓN

    ========================= */

    body::before {

      content: "";

      position: fixed;

      width: 420px;

      height: 420px;

      border-radius: 50%;

      border: 1px solid rgba(0, 191, 255, 0.07);

      top: -210px;

      left: -210px;

      pointer-events: none;

    }

    body::after {

      content: "";

      position: fixed;

      width: 500px;

      height: 500px;

      border-radius: 50%;

      border: 1px solid rgba(212, 175, 55, 0.06);

      bottom: -270px;

      right: -240px;

      pointer-events: none;

    }

    /* =========================

       CONTENEDOR

    ========================= */

    .login-container {

      width: 100%;

      max-width: 500px;

      position: relative;

      z-index: 2;

    }

    /* =========================

       TARJETA

    ========================= */

    .login-box {

      position: relative;

      background:

        linear-gradient(

          145deg,

          rgba(22, 22, 22, 0.98),

          rgba(10, 10, 10, 0.98)

        );

      padding: 38px 34px 28px;

      border-radius: 18px;

      border: 1px solid var(--borde);

      box-shadow:

        0 15px 40px rgba(0, 0, 0, 0.45),

        inset 0 1px 0 rgba(255, 255, 255, 0.025),

        0 0 25px rgba(0, 191, 255, 0.06);

      overflow: hidden;

      animation: aparecer 0.5s ease-out;

    }

    /* LÍNEA SUPERIOR */

    .login-box::before {

      content: "";

      position: absolute;

      top: 0;

      left: 0;

      right: 0;

      height: 2px;

      background:

        linear-gradient(

          90deg,

          transparent,

          var(--celeste),

          var(--dorado),

          var(--celeste),

          transparent

        );

    }

    /* =========================

       LOGO

    ========================= */

    .brand {

      text-align: center;

      margin-bottom: 30px;

    }

    .brand h1 {

      font-size: 38px;

      font-weight: 900;

      letter-spacing: 5px;

      line-height: 1;

      text-shadow:

        0 0 15px rgba(0, 191, 255, 0.12);

    }

    .brand-nova {

      color: var(--celeste);

    }

    .brand-guet {

      color: var(--dorado);

    }

    .brand-line {

      width: 70px;

      height: 3px;

      margin: 13px auto;

      border-radius: 20px;

      background:

        linear-gradient(

          90deg,

          var(--celeste),

          var(--dorado)

        );

    }

    .brand p {

      color: var(--texto-secundario);

      font-size: 13px;

      letter-spacing: 1px;

    }

    /* =========================

       TITULO

    ========================= */

    .admin-title {

      text-align: center;

      margin-bottom: 27px;

    }

    .admin-title h2 {

      color: var(--dorado);

      margin-bottom: 9px;

      font-size: 22px;

      letter-spacing: 1px;

    }

    .admin-title p {

      color: var(--texto-secundario);

      font-size: 13px;

      line-height: 1.5;

    }

    /* =========================

       ICONO

    ========================= */

    .admin-icon {

      width: 50px;

      height: 50px;

      margin: 0 auto 13px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      background:

        rgba(0, 191, 255, 0.07);

      border:

        1px solid rgba(0, 191, 255, 0.20);

      font-size: 22px;

      box-shadow:

        0 8px 20px rgba(0, 0, 0, 0.20);

    }

    /* =========================

       FORMULARIO

    ========================= */

    .input-group {

      margin-bottom: 18px;

    }

    .input-group label {

      display: block;

      margin-bottom: 8px;

      color: #e7e7e7;

      font-size: 13px;

      font-weight: bold;

      letter-spacing: 0.4px;

    }

    .input-wrapper {

      position: relative;

    }

    .input-wrapper input {

      width: 100%;

      height: 51px;

      padding:

        0 47px 0 43px;

      border:

        1px solid #2b2b2b;

      border-radius: 10px;

      outline: none;

      background: var(--gris-input);

      color: white;

      font-size: 15px;

      transition:

        border-color 0.2s ease,

        box-shadow 0.2s ease,

        background 0.2s ease;

    }

    .input-wrapper input::placeholder {

      color: #777;

    }

    .input-wrapper input:hover {

      border-color: #3a3a3a;

    }

    .input-wrapper input:focus {

      border-color: var(--celeste);

      box-shadow:

        0 0 0 3px rgba(0, 191, 255, 0.10);

      background: #101010;

    }

    /* =========================

       ICONOS

    ========================= */

    .input-icon {

      position: absolute;

      left: 14px;

      top: 50%;

      transform: translateY(-50%);

      color: #777;

      font-size: 17px;

      pointer-events: none;

    }

    /* =========================

       OJO

    ========================= */

    .eye {

      position: absolute;

      right: 14px;

      top: 50%;

      transform: translateY(-50%);

      color: #777;

      font-size: 17px;

      cursor: pointer;

      user-select: none;

      transition: color 0.2s ease;

    }

    .eye:hover {

      color: var(--celeste);

    }

    /* =========================

       BOTÓN

    ========================= */

    .login-button {

      width: 100%;

      margin-top: 5px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background:

        linear-gradient(

          135deg,

          #00BFFF,

          #009acd

        );

      color: white;

      font-weight: bold;

      font-size: 15px;

      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:

        0 7px 20px rgba(0, 191, 255, 0.16);

      transition:

        transform 0.2s ease,

        box-shadow 0.2s ease,

        filter 0.2s ease;

    }

    .login-button:hover {

      transform: translateY(-2px);

      box-shadow:

        0 10px 25px rgba(0, 191, 255, 0.25);

      filter: brightness(1.08);

    }

    .login-button:active {

      transform: translateY(0);

    }

    /* =========================

       ERROR

    ========================= */

    .error {

      display: none;

      margin-top: 15px;

      padding: 12px 14px;

      border-radius: 10px;

      background:

        rgba(255, 77, 77, 0.07);

      border:

        1px solid rgba(255, 77, 77, 0.20);

      color: #ff7070;

      text-align: center;

      font-size: 12px;

      line-height: 1.4;

    }

    /* =========================

       VOLVER

    ========================= */

    .back {

      display: block;

      width: 100%;

      margin-top: 20px;

      padding: 12px;

      text-align: center;

      text-decoration: none;

      background: #050505;

      color: white;

      border:

        1px solid var(--dorado);

      border-radius: 10px;

      font-weight: bold;

      font-size: 13px;

      transition:

        background 0.2s ease,

        color 0.2s ease,

        transform 0.2s ease,

        box-shadow 0.2s ease;

    }

    .back:hover {

      background: var(--dorado);

      color: #050505;

      transform: translateY(-2px);

      box-shadow:

        0 8px 20px rgba(212, 175, 55, 0.18);

    }

    /* =========================

       SEGURIDAD

    ========================= */

    .security {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      margin-top: 20px;

      padding-top: 18px;

      border-top: 1px solid #292929;

      color: #777;

      font-size: 10px;

      letter-spacing: 0.4px;

      text-align: center;

    }

    .security-dot {

      width: 6px;

      height: 6px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #35d46b;

      box-shadow:

        0 0 8px rgba(53, 212, 107, 0.45);

    }

    /* =========================

       ANIMACIÓN

    ========================= */

    @keyframes aparecer {

      from {

        opacity: 0;

        transform: translateY(15px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }

    /* =========================

       TELEFONO

    ========================= */

    @media (max-width: 700px) {

      body {

        padding: 18px;

      }

      .login-box {

        padding: 32px 22px 25px;

        border-radius: 15px;

      }

      .brand h1 {

        font-size: 32px;

        letter-spacing: 4px;

      }

      .admin-title h2 {

        font-size: 20px;

      }

      .input-wrapper input {

        height: 50px;

      }

      .login-button {

        padding: 14px;

      }

    }

    /* =========================

       TELEFONO PEQUEÑO

    ========================= */

    @media (max-width: 400px) {

      body {

        padding: 14px;

      }

      .login-box {

        padding: 28px 17px 23px;

      }

      .brand h1 {

        font-size: 27px;

        letter-spacing: 3px;

      }

      .admin-title h2 {

        font-size: 18px;

      }

      .admin-title p {

        font-size: 12px;

      }

    }

  </style>

</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <!-- LOGO -->

      <div class="brand">

        <h1>

          <span class="brand-nova">NOVA</span><span class="brand-guet">GUET</span>

        </h1>

        <div class="brand-line"></div>

        <p>Moda que habla por ti.</p>

      </div>

      <!-- TITULO -->

      <div class="admin-title">

        <div class="admin-icon">

          ⚙️

        </div>

        <h2>

          PANEL DE ADMINISTRACIÓN

        </h2>

        <p>

          Acceso exclusivo para administrar NOVAGUET

        </p>

      </div>

      <!-- LOGIN -->

      <form id="loginForm">

        <!-- USUARIO -->

        <div class="input-group">

          <label for="username">

            Usuario

          </label>

          <div class="input-wrapper">

            <span class="input-icon">

              👤

            </span>

            <input

              type="text"

              id="username"

              placeholder="Ingresa tu usuario"

              autocomplete="username"

              required

            >

          </div>

        </div>

        <!-- CONTRASEÑA -->

        <div class="input-group">

          <label for="password">

            Contraseña

          </label>

          <div class="input-wrapper">

            <span class="input-icon">

              🔒

            </span>

            <input

              type="password"

              id="password"

              placeholder="Ingresa tu contraseña"

              autocomplete="current-password"

              required

            >

            <span

              class="eye"

              id="togglePassword"

              aria-label="Mostrar contraseña"

            >

              👁️

            </span>

          </div>

        </div>

        <!-- BOTÓN -->

        <button

          type="submit"

          class="login-button"

        >

          INGRESAR AL PANEL

        </button>

        <!-- ERROR -->

        <div

          class="error"

          id="errorMessage"

        >

          Usuario o contraseña incorrectos.

        </div>

      </form>

      <!-- VOLVER -->

      <a

        href="/"

        class="back"

      >

        ← VOLVER A NOVAGUET

      </a>

      <!-- SEGURIDAD -->

      <div class="security">

        <span class="security-dot"></span>

        Área segura de administración NOVAGUET

      </div>

    </div>

  </div>

  <script>

    const loginForm =

      document.getElementById("loginForm");

    const password =

      document.getElementById("password");

    const togglePassword =

      document.getElementById("togglePassword");

    const errorMessage =

      document.getElementById("errorMessage");

    /* =========================

       MOSTRAR / OCULTAR CONTRASEÑA

    ========================= */

    togglePassword.addEventListener(

      "click",

      () => {

        if (password.type === "password") {

          password.type = "text";

          togglePassword.textContent = "🙈";

        } else {

          password.type = "password";

          togglePassword.textContent = "👁️";

        }

      }

    );

    /* =========================

       LOGIN

    ========================= */

    loginForm.addEventListener(

      "submit",

      async (e) => {

        e.preventDefault();

        errorMessage.style.display = "none";

        const username =

          document.getElementById("username").value.trim();

        const passwordValue =

          password.value;

        try {

          const response =

            await fetch(

              "/api/login",

              {

                method: "POST",

                headers: {

                  "Content-Type": "application/json"

                },

                credentials: "include",

                body: JSON.stringify({

                  username: username,

                  password: passwordValue

                })

              }

            );

          if (response.ok) {

            window.location.href =

              "/admin.html";

          } else {

            errorMessage.style.display =

              "block";

          }

        } catch (error) {

          errorMessage.textContent =

            "No se pudo conectar con el servidor.";

          errorMessage.style.display =

            "block";

        }

      }

    );

  </script>

</body>

</html>
