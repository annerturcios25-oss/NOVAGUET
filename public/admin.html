<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVAGUET | Administración</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      background: #111111;
      border-bottom: 2px solid #d4af37;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .brand h1 {
      color: #00bfff;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .brand p {
      color: #d4af37;
      font-size: 12px;
      margin-top: 4px;
    }

    .logout-btn {
      background: #c01717;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #e02020;
    }

    main {
      width: 94%;
      max-width: 1400px;
      margin: 30px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      color: #d4af37;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #aaa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
    }

    .stat h3 {
      color: #00bfff;
      font-size: 34px;
      margin-bottom: 7px;
    }

    .stat p {
      color: #aaa;
    }

    .section {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .section-title {
      color: #d4af37;
      font-size: 22px;
      margin-bottom: 20px;
      border-bottom: 1px solid #292929;
      padding-bottom: 12px;
    }

    form {
      display: grid;
      gap: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #d4af37;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid #383838;
      border-radius: 8px;
      color: white;
      padding: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #00bfff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .primary-btn {
      background: #00bfff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .primary-btn:hover {
      background: #24c9ff;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #162b16;
      color: #7dff7d;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: #181818;
      border: 1px solid #303030;
      border-radius: 12px;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #222;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      color: white;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .price {
      color: #d4af37;
      font-weight: bold;
      font-size: 19px;
      margin-bottom: 7px;
    }

    .product-info p {
      color: #aaa;
      font-size: 13px;
      margin: 4px 0;
    }

    .stock {
      color: #00bfff !important;
      font-weight: bold;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order-card {
      background: #181818;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 18px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .order-id {
      color: #00bfff;
      font-weight: bold;
      font-size: 17px;
    }

    .order-date {
      color: #888;
      font-size: 13px;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 20px;
      margin-bottom: 15px;
    }

    .order-info div {
      color: #bbb;
      font-size: 14px;
    }

    .order-info strong {
      color: white;
    }

    .order-products {
      border-top: 1px solid #303030;
      border-bottom: 1px solid #303030;
      padding: 12px 0;
      margin-bottom: 15px;
    }

    .order-products p {
      color: #ccc;
      margin: 5px 0;
      font-size: 14px;
    }

    .order-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-total {
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
    }

    .status-select {
      min-width: 170px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 25px;
    }

    @media (max-width: 750px) {
      header {
        padding: 14px;
      }

      .brand img {
        width: 48px;
        height: 48px;
      }

      .brand h1 {
        font-size: 19px;
      }

      .brand p {
        font-size: 10px;
      }

      .logout-btn {
        padding: 9px 11px;
        font-size: 12px;
      }

      main {
        width: 94%;
        margin: 20px auto;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .section {
        padding: 18px;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .order-bottom {
        align-items: stretch;
      }

      .status-select {
        width: 100%;
      }
    }
    /* Ajuste de imágenes de productos */
.product-image {
  width: 100%;
  height: 120px;
  object-fit: contain;
  display: block;
  background: #222;
}
.products-grid .card > img {
  width: 100% !important;
  height: 170px !important;
  max-height: 170px !important;
  object-fit: contain !important;
  display: block !important;
}

/* =========================
   BOTONES EDITAR / BORRAR
========================= */

.product-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.product-actions button {
  flex: 1;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

/* EDITAR - AZUL + DORADO */

.product-actions .edit-product {
  background: linear-gradient(135deg, #050505, #003b5c);
  color: #00bfff;
  border-color: #00bfff;
  box-shadow: 0 0 0 rgba(0, 191, 255, 0);
}

.product-actions .edit-product:hover {
  background: linear-gradient(135deg, #003b5c, #00bfff);
  color: #000;
  border-color: #d4af37;
  box-shadow: 0 0 14px rgba(0, 191, 255, 0.45);
  transform: translateY(-2px);
}

/* BORRAR - NEGRO + DORADO */

.product-actions .delete-product {
  background: linear-gradient(135deg, #050505, #1a1a1a);
  color: #d4af37;
  border-color: #d4af37;
  box-shadow: 0 0 0 rgba(212, 175, 55, 0);
}

.product-actions .delete-product:hover {
  background: linear-gradient(135deg, #d4af37, #000);
  color: #000;
  border-color: #00bfff;
  box-shadow: 0 0 14px rgba(212, 175, 55, 0.45);
  transform: translateY(-2px);
}

.product-actions button:active {
  transform: scale(0.96);
}

/* EFECTO DE BRILLO */

.product-actions button::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.18),
    transparent
  );
  transform: skewX(-20deg);
  transition: left 0.45s ease;
}

.product-actions button:hover::after {
  left: 140%;
}

/* MÓVIL */

@media (max-width: 500px) {

  .product-actions {
    gap: 8px;
  }

  .product-actions button {
    padding: 10px 8px;
    font-size: 13px;
  }

}

  </style>

</head>

<body>

  <header>
    <div class="brand">
      <img
        src="/images/NOVAGUET.PNG.png"
        alt="NOVAGUET"
        onerror="this.style.display='none'"
      >

      <div>
        <h1>NOVAGUET</h1>
        <p>Panel de Administración</p>
      </div>
    </div>

    <button
      class="logout-btn"
      id="logoutButton"
    >
      Cerrar sesión
    </button>
  </header>

  <main>

    <div class="welcome">
      <h2>Administración</h2>
      <p>Gestiona productos, inventario y pedidos de NOVAGUET.</p>
    </div>

    <section class="stats">

      <div class="stat">
        <h3 id="totalProducts">0</h3>
        <p>Productos</p>
      </div>

      <div class="stat">
        <h3 id="totalStock">0</h3>
        <p>Unidades en stock</p>
      </div>

      <div class="stat">
        <h3 id="pendingOrders">0</h3>
        <p>Pedidos pendientes</p>
      </div>

    </section>

    <section class="section">

      <h2 class="section-title">
        ➕ Agregar producto
      </h2>

      <form
        id="productForm"
        enctype="multipart/form-data"
      >

        <div class="form-grid">

          <div class="field">
            <label for="nombre">
              Nombre
            </label>

            <input
              id="nombre"
              name="nombre"
              type="text"
              required
            >
          </div>

          <div class="field">
            <label for="precio">
              Precio (HNL)
            </label>

            <input
              id="precio"
              name="precio"
              type="number"
              min="0"
              required
            >
          </div>

          <div class="field">
            <label for="categoria">
              Categoría
            </label>

            <select
              id="categoria"
              name="categoria"
              required
            >
              <option value="">
                Seleccionar
              </option>

              <option value="Ropa">
                Ropa
              </option>

              <option value="Calzado">
                Calzado
              </option>

              <option value="Accesorios">
                Accesorios
              </option>
            </select>
          </div>

          <div class="field">
            <label for="talla">
              Talla
            </label>

            <input
              id="talla"
              name="talla"
              type="text"
            >
          </div>

          <div class="field">
            <label for="stock">
              Stock
            </label>

            <input
              id="stock"
              name="stock"
              type="number"
              min="0"
              value="0"
              required
            >
          </div>

          <div class="field">
            <label for="imagen">
              Imagen
            </label>

            <input
              id="imagen"
              name="imagen"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            >
          </div>

          <div class="field full">
            <label for="descripcion">
              Descripción
            </label>

            <textarea
              id="descripcion"
              name="descripcion"
            ></textarea>
          </div>

        </div>

        <button
          type="submit"
          class="primary-btn"
        >
          AGREGAR PRODUCTO
        </button>

        <div
          id="productMessage"
          class="message"
        ></div>

      </form>

    </section>

    <section class="section">

      <h2 class="section-title">
        👕 Productos
      </h2>

      <div
        id="productsContainer"
        class="products-grid"
      >
        <div class="loading">
          Cargando productos...
        </div>
      </div>

    </section>

    <section class="section">

      <h2 class="section-title">
        📦 Pedidos
      </h2>

      <div
        id="ordersContainer"
        class="orders"
      >
        <div class="loading">
          Cargando pedidos...
        </div>
      </div>

    </section>

  </main>

  <script src="/admin.js"></script>

</body>
</html>
