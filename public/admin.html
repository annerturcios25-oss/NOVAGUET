<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVAGUET | Administración</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #111;
    }

    header {
      background: #050505;
      color: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 6px solid #35bce5;
    }

    header h1 {
      color: #35bce5;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    .admin-container {
      width: 100%;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .admin-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .admin-title h2 {
      color: #d4af37;
      margin-bottom: 8px;
    }

    .admin-title p {
      color: #666;
    }

    .add-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.10);
      margin-bottom: 35px;
    }

    .add-box h3 {
      margin-bottom: 20px;
      color: #111;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #35bce5;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .add-button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #00BFFF;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .add-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0,0,0,.2);
    }

    .products-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.10);
    }

    .products-box h3 {
      margin-bottom: 20px;
      color: #d4af37;
    }

    #adminProducts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .admin-product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
    }

    .admin-product img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .admin-product h4 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .admin-product p {
      margin: 5px 0;
      color: #555;
      font-size: 14px;
    }

    .edit-button {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #00BFFF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-button:hover {
      background: #009acd;
    }

    .delete-button {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #050505;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #222;
    }

    .stock-available {
      font-weight: bold;
      color: #168a3a !important;
    }

    .stock-empty {
      font-weight: bold;
      color: #d00000 !important;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .back-button {
      display: block;
      width: 220px;
      margin: 30px auto;
      padding: 13px;
      text-align: center;
      text-decoration: none;
      background: #050505;
      color: white;
      border: 2px solid #f5c400;
      border-radius: 7px;
      font-weight: bold;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      #adminProducts {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

  <header>

    <h1>NOVAGUET</h1>

    <p>Panel de Administración</p>

  </header>


  <main class="admin-container">

    <div class="admin-title">

      <h2>ADMINISTRAR PRODUCTOS</h2>

      <p>
        Agrega nuevos productos o elimina los que ya no estén disponibles.
      </p>

    </div>


    <!-- AGREGAR PRODUCTO -->

    <section class="add-box">

      <h3>➕ AGREGAR PRODUCTO</h3>

      <form id="productForm">

        <div class="form-grid">

          <div class="form-group">

            <label for="nombre">
              Nombre del producto
            </label>

            <input
              type="text"
              id="nombre"
              required
            >

          </div>


          <div class="form-group">

            <label for="precio">
              Precio HNL
            </label>

            <input
              type="number"
              id="precio"
              min="0"
              required
            >

          </div>


          <div class="form-group">

            <label for="stock">
              Cantidad disponible
            </label>

            <input
              type="number"
              id="stock"
              min="0"
              value="0"
              required
            >

          </div>


          <div class="form-group">

            <label for="categoria">
              Categoría
            </label>

            <select id="categoria" required>

              <option value="">
                Seleccionar categoría
              </option>

              <option value="Ropa">
                Ropa
              </option>

              <option value="Calzado">
                Calzado
              </option>

              <option value="Accesorios">
                Accesorios
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="talla">
              Talla
            </label>

            <input
              type="text"
              id="talla"
              placeholder="Ej. M, L, 5, 2T"
              required
            >

          </div>


          <div class="form-group full">

            <label for="descripcion">
              Descripción
            </label>

            <textarea
              id="descripcion"
              placeholder="Descripción del producto"
            ></textarea>

          </div>


          <div class="form-group full">

            <label for="imagen">
              Imagen del producto
            </label>

            <input
              type="file"
              id="imagen"
              accept="image/*"
            >

          </div>

        </div>


        <button
          type="submit"
          class="add-button"
        >
          AGREGAR PRODUCTO
        </button>

      </form>


      <div
        id="formMessage"
        class="message"
      ></div>

    </section>


    <!-- PRODUCTOS -->

    <section class="products-box">

      <h3>
        📦 PRODUCTOS ACTUALES
      </h3>

      <div id="adminProducts">

        Cargando productos...

      </div>

    </section>


    <a
      href="/"
      class="back-button"
    >
      ← VOLVER A NOVAGUET
    </a>

  </main>


  <script>

    const productForm =
      document.getElementById("productForm");

    const adminProducts =
      document.getElementById("adminProducts");

    const formMessage =
      document.getElementById("formMessage");


    /* =========================
       CARGAR PRODUCTOS
    ========================= */

    async function cargarProductosAdmin() {

      try {

        const respuesta =
          await fetch("/api/productos");

        if (!respuesta.ok) {

          throw new Error(
            "No se pudieron cargar los productos"
          );

        }

        const productos =
          await respuesta.json();

        mostrarProductosAdmin(productos);

      } catch (error) {

        console.error(error);

        adminProducts.innerHTML =
          "<p>No se pudieron cargar los productos.</p>";

      }

    }


    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */

    function mostrarProductosAdmin(productos) {

      if (!productos.length) {

        adminProducts.innerHTML =
          "<p>No hay productos.</p>";

        return;

      }


      adminProducts.innerHTML =
        productos.map(producto => {

          const stock =
            Number(producto.stock ?? 0);

          const stockHTML =
            stock > 0
              ? `
                <p class="stock-available">
                  📦 Disponible:
                  ${stock}
                </p>
              `
              : `
                <p class="stock-empty">
                  ❌ AGOTADO
                </p>
              `;

          return `

            <div class="admin-product">

              <img
                src="${producto.imagen}"
                alt="${producto.nombre}"
              >

              <h4>
                ${producto.nombre}
              </h4>

              <p>
                Precio:
                HNL ${producto.precio}
              </p>

              <p>
                Categoría:
                ${producto.categoria}
              </p>

              <p>
                Talla:
                ${producto.talla || "N/A"}
              </p>

              ${stockHTML}

              <button
                class="edit-button"
                onclick="editarProducto(${producto.id})"
              >
                ✏️ EDITAR PRODUCTO
              </button>

              <button
                class="delete-button"
                onclick="eliminarProducto(${producto.id})"
              >
                🗑️ ELIMINAR PRODUCTO
              </button>

            </div>

          `;

        }).join("");

    }


    /* =========================
       EDITAR PRODUCTO
    ========================= */

    async function editarProducto(id) {

      const respuesta =
        await fetch("/api/productos");

      const productos =
        await respuesta.json();

      const producto =
        productos.find(
          producto =>
            String(producto.id) === String(id)
        );

      if (!producto) {

        alert("No se encontró el producto.");

        return;

      }

      document.getElementById("nombre").value =
        producto.nombre || "";

      document.getElementById("precio").value =
        producto.precio || "";

      document.getElementById("stock").value =
        producto.stock ?? 0;

      document.getElementById("categoria").value =
        producto.categoria || "";

      document.getElementById("talla").value =
        producto.talla || "";

      document.getElementById("descripcion").value =
        producto.descripcion || "";

      window.productoEditandoId =
        producto.id;

      const boton =
        productForm.querySelector(".add-button");

      boton.textContent =
        "💾 GUARDAR CAMBIOS";

      formMessage.textContent =
        "✏️ Editando: " + producto.nombre;

      productForm.scrollIntoView({
        behavior: "smooth"
      });

    }


    /* =========================
       ELIMINAR PRODUCTO
    ========================= */

    async function eliminarProducto(id) {

      const confirmar =
        confirm(
          "¿Seguro que quieres eliminar este producto?"
        );

      if (!confirmar) return;


      try {

        const respuesta =
          await fetch(
            "/api/productos/" + id,
            {
              method: "DELETE",
              headers: {
                "Authorization":
                  "Basic " +
                  btoa(
                    "NOVAGUET:Novaguet/2005"
                  )
              }
            }
          );


        if (!respuesta.ok) {

          const error =
            await respuesta.text();

          throw new Error(error);

        }


        alert(
          "Producto eliminado correctamente."
        );


        cargarProductosAdmin();

      } catch (error) {

        console.error(error);

        alert(
          "No se pudo eliminar el producto."
        );

      }

    }


    /* =========================
       AGREGAR / EDITAR PRODUCTO
    ========================= */

    productForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const formData =
          new FormData();


        formData.append(
          "nombre",
          document.getElementById("nombre").value
        );


        formData.append(
          "precio",
          document.getElementById("precio").value
        );


        formData.append(
          "stock",
          document.getElementById("stock").value
        );


        formData.append(
          "categoria",
          document.getElementById("categoria").value
        );


        formData.append(
          "talla",
          document.getElementById("talla").value
        );


        formData.append(
          "descripcion",
          document.getElementById("descripcion").value
        );


        const imagen =
          document.getElementById("imagen").files[0];


        if (imagen) {

          formData.append(
            "imagen",
            imagen
          );

        }


        try {

          const estaEditando =
            window.productoEditandoId;


          formMessage.textContent =
            estaEditando
              ? "Guardando cambios..."
              : "Agregando producto...";


          let url =
            "/api/productos";

          let metodo =
            "POST";


          if (estaEditando) {

            url =
              "/api/productos/" +
              estaEditando;

            metodo =
              "PUT";

          }


          const respuesta =
            await fetch(
              url,
              {
                method: metodo,

                headers: {
                  "Authorization":
                    "Basic " +
                    btoa(
                      "NOVAGUET:Novaguet/2005"
                    )
                },

                body: formData

              }
            );


          if (!respuesta.ok) {

            const error =
              await respuesta.text();

            throw new Error(error);

          }


          formMessage.textContent =
            estaEditando
              ? "✅ Producto actualizado correctamente."
              : "✅ Producto agregado correctamente.";


          productForm.reset();


          window.productoEditandoId =
            null;


          const boton =
            productForm.querySelector(
              ".add-button"
            );


          boton.textContent =
            "AGREGAR PRODUCTO";


          cargarProductosAdmin();


        } catch (error) {

          console.error(error);

          formMessage.textContent =
            "❌ No se pudo guardar el producto.";

        }

      }
    );


    /* =========================
       INICIAR
    ========================= */

    cargarProductosAdmin();

  </script>

</body>

</html>
