<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta | NOVAGUET</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: #101010;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 440px;
      margin: 35px auto;
      padding: 26px;
      border: 1px solid #333333;
      border-radius: 14px;
      background: #181818;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitulo {
      color: #cccccc;
      text-align: center;
      margin-bottom: 25px;
    }

    .pestanas {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    button {
      cursor: pointer;
      font-size: 15px;
    }

    .pestanas button {
      flex: 1;
      padding: 12px 6px;
      color: white;
      background: #292929;
      border: 1px solid #444444;
      border-radius: 7px;
    }

    .pestanas button.activa {
      background: #00bfff;
      color: #000000;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      color: white;
      background: #252525;
      border: 1px solid #444444;
      border-radius: 7px;
      font-size: 16px;
    }

    .principal {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #00bfff;
      color: #000000;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
    }

    .volver {
      display: block;
      margin-top: 22px;
      color: #00bfff;
      text-align: center;
      text-decoration: none;
    }

    #mensaje {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .oculto {
      display: none;
    }

    /* =====================================
   NOVAGUET — NEGRO, DORADO Y AZUL
===================================== */

body {
  background: #080808;
  color: #ffffff;
}

/* Tarjeta principal */
.contenedor {
  background: linear-gradient(145deg, #111111, #202020);
  border: 1px solid #D4AF37;
  border-radius: 18px;
  box-shadow: 0 0 25px rgba(0, 191, 255, 0.12);
}

/* Título */
.contenedor h1 {
  color: #D4AF37;
  letter-spacing: 2px;
}

/* Subtítulo */
.subtitulo {
  color: #00BFFF;
}

/* Pestañas */
.pestanas button {
  background: #171717;
  color: #D4AF37;
  border: 1px solid #D4AF37;
  border-radius: 9px;
}

/* Pestaña activa */
.pestanas button.activa {
  background: #00BFFF;
  color: #050505;
  border-color: #D4AF37;
}

/* Etiquetas */
.contenedor label {
  color: #ffffff;
}

/* Campos de entrada */
.contenedor input {
  background: #f5f5f5;
  color: #111111;
  border: 2px solid #D4AF37;
  border-radius: 9px;
}

/* Campo seleccionado */
.contenedor input:focus {
  outline: none;
  border-color: #00BFFF;
  box-shadow: 0 0 8px rgba(0, 191, 255, 0.4);
}

/* Botón principal */
#botonEnviar {
  background: #00BFFF;
  color: #050505;
  border: 1px solid #D4AF37;
  border-radius: 9px;
  font-weight: bold;
  transition: background 0.25s ease;
}

/* Efecto del botón */
#botonEnviar:hover {
  background: #D4AF37;
  color: #050505;
}

/* Enlaces */
.contenedor a {
  color: #00BFFF;
}

.contenedor a:hover {
  color: #D4AF37;
}

/* Ajuste para teléfonos */
@media (max-width: 480px) {
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px;
    overflow-x: hidden;
  }

  .contenedor {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 0 auto;
  }

  .pestanas {
    display: flex;
    width: 100%;
    gap: 6px;
  }

  .pestanas button {
    flex: 1;
    min-width: 0;
    max-width: 100%;
    padding: 12px 4px;
    font-size: 14px;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  input,
  select,
  textarea {
    max-width: 100%;
  }
}
  </style>
</head>
<body>
  <main class="contenedor">
    <h1>NOVAGUET</h1>
    <p class="subtitulo">Tu estilo. Tu cuenta.</p>

    <div class="pestanas">
      <button type="button" id="botonLogin" class="activa">
        Iniciar sesión
      </button>
      <button type="button" id="botonRegistro">
        Crear cuenta
      </button>
    </div>

    <form id="formulario">
      <div id="campoNombre" class="oculto">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          minlength="2"
          maxlength="100"
          autocomplete="name"
        >
      </div>

      <label for="email">Correo electrónico</label>
<input
  id="email"
  name="email"
  type="email"
  maxlength="254"
  autocomplete="username"
  required
>

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        maxlength="1024"
        autocomplete="current-password"
        required
      >

      <button class="principal" type="submit" id="botonEnviar">
        Iniciar sesión
      </button>
    </form>

    <p id="mensaje" role="status" aria-live="polite"></p>

    <a class="volver" href="index.html">
      Volver a la tienda
    </a>
  </main>

  <script>
    const formulario = document.getElementById("formulario");
    const campoNombre = document.getElementById("campoNombre");
    const nombre = document.getElementById("nombre");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const botonLogin = document.getElementById("botonLogin");
    const botonRegistro = document.getElementById("botonRegistro");
    const botonEnviar = document.getElementById("botonEnviar");
    const mensaje = document.getElementById("mensaje");

    let modo = "login";

    function cambiarModo(nuevoModo) {
      modo = nuevoModo;
      const esRegistro = modo === "registro";

      campoNombre.classList.toggle("oculto", !esRegistro);
      nombre.required = esRegistro;
      password.autocomplete = esRegistro
        ? "new-password"
        : "current-password";

      botonLogin.classList.toggle("activa", !esRegistro);
      botonRegistro.classList.toggle("activa", esRegistro);

      botonEnviar.textContent = esRegistro
        ? "Crear cuenta"
        : "Iniciar sesión";

      mensaje.textContent = "";
    }

    botonLogin.addEventListener("click", () => {
      cambiarModo("login");
    });

    botonRegistro.addEventListener("click", () => {
      cambiarModo("registro");
    });

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensaje.textContent = "";
      botonEnviar.disabled = true;

      const datos = {
        email: email.value.trim(),
        password: password.value
      };

      let ruta = "/api/clientes/login";

      if (modo === "registro") {
        datos.nombre = nombre.value.trim();
        ruta = "/api/clientes/registro";
      }

      try {
        const respuesta = await fetch(ruta, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
          mensaje.textContent =
            resultado.error || "No se pudo completar la operación.";
          return;
        }

        if (modo === "registro") {
          cambiarModo("login");
          password.value = "";
          mensaje.textContent =
            "Cuenta creada correctamente. Ahora inicia sesión.";
        } else {
          window.location.href = "mis-pedidos.html";
        }
      } catch (error) {
        mensaje.textContent =
          "No se pudo conectar con NOVAGUET. Inténtalo de nuevo.";
      } finally {
        botonEnviar.disabled = false;
      }
    });
  </script>
</body>
</html>
